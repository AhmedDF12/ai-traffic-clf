version: 1
dataset: cic_ids2017
notes: >
  DoS tool names join ddos. Rare web attacks and Heartbleed join malware
  because each class would otherwise have only tens of flows. The original
  string is kept in label_raw. Web-attack labels in the official CSV often
  use an en dash; the loader treats that dash as ASCII.
map:
  benign:
    - BENIGN
  ddos:
    - DDoS
    - DoS GoldenEye
    - DoS Hulk
    - DoS Slowhttptest
    - DoS slowloris
  brute_force:
    - FTP-Patator
    - SSH-Patator
    - Web Attack - Brute Force
    - Web Attack-Brute Force
  port_scan:
    - PortScan
  botnet:
    - Bot
  malware:
    - Infiltration
    - Heartbleed
    - Web Attack - XSS
    - Web Attack-XSS
    - Web Attack - Sql Injection
    - Web Attack-Sql Injection
