version: 1
# Statistical flow features. Ports, addresses, timestamps, SNI, and flow ids
# are identifiers. They are stored for audit and for the dashboard, and they
# are not model inputs. Bulk, window, and subflow columns from CICFlowMeter
# are intentionally absent until a later ablation adds them.
numeric:
  - duration
  - fwd_packets
  - bwd_packets
  - fwd_bytes
  - bwd_bytes
  - fwd_pkt_len_min
  - fwd_pkt_len_max
  - fwd_pkt_len_mean
  - fwd_pkt_len_std
  - bwd_pkt_len_min
  - bwd_pkt_len_max
  - bwd_pkt_len_mean
  - bwd_pkt_len_std
  - pkt_len_min
  - pkt_len_max
  - pkt_len_mean
  - pkt_len_std
  - flow_iat_min
  - flow_iat_max
  - flow_iat_mean
  - flow_iat_std
  - fwd_iat_min
  - fwd_iat_max
  - fwd_iat_mean
  - fwd_iat_std
  - bwd_iat_min
  - bwd_iat_max
  - bwd_iat_mean
  - bwd_iat_std
  - syn_count
  - ack_count
  - fin_count
  - rst_count
  - psh_count
  - urg_count
  - bytes_per_s
  - packets_per_s
  - down_up_ratio
  - active_min
  - active_max
  - active_mean
  - active_std
  - idle_min
  - idle_max
  - idle_mean
  - idle_std
categorical:
  - protocol
identifiers:
  - flow_id
  - src_ip
  - dst_ip
  - src_port
  - dst_port
  - timestamp
