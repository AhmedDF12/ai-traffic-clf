[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-clf"
version = "0.1.0"
description = "AI-based network traffic classification for application, service, and security tasks."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "mlflow>=2.14",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
boost = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2", "optuna>=3.6", "shap>=0.45"]
dl = ["torch>=2.2"]
capture = ["scapy>=2.5", "nfstream>=6.5"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "onnx>=1.16", "onnxruntime>=1.17"]

[project.scripts]
traffic-clf = "traffic_clf.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q"]
